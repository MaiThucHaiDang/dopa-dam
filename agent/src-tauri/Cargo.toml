[package]
name = "dopadam"
version = "0.1.0"
description = "DopaDam agent for Windows and Linux"
authors = ["Dang"]
edition = "2021"
rust-version = "1.90"
default-run = "dopadam"

[lib]
name = "dopadam_lib"
crate-type = ["rlib"]

[[bin]]
name = "dopadam"
path = "src/main.rs"


[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust secret service client (zbus); without a backend feature keyring silently falls back to a mock store.
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "async-io"] }
x11rb = { version = "0.13", features = ["screensaver", "randr"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
