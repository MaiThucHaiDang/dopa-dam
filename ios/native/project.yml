# XcodeGen spec for the DopaDam iPhone app. `xcodegen generate` (run in this folder) writes DopaDam.xcodeproj.
# No signing team: build with CODE_SIGNING_ALLOWED=NO and sign the result later (see README.md).
name: DopaDam

options:
  bundleIdPrefix: com.dang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DopaDamCore:
    path: DopaDamCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""

targets:
  DopaDam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DopaDam
    dependencies:
      - package: DopaDamCore
    settings:
      base:
        PRODUCT_NAME: DopaDam
        PRODUCT_BUNDLE_IDENTIFIER: com.dang.dopadam
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The Info.plist is generated from these keys.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DopaDam
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
