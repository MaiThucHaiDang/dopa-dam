# Builds the native DopaDam iPhone app on a macOS runner and uploads an UNSIGNED .ipa.
# Runs only when started by hand (Actions -> "Ung dung DopaDam cho iPhone" -> Run workflow).
# The .ipa has no signature: sign it with your own tool (AltStore, Sideloadly, ...) before installing.
# See ios/native/README.md.
name: Ung dung DopaDam cho iPhone

on:
  workflow_dispatch:
  push:
    branches: [linux-port]
    paths:
      - "ios/native/**"
      - "shared/test-vectors/**"
      - ".github/workflows/ios-app.yml"

# contents: write only for the last step, which publishes the logs on the ci-logs branch.
permissions:
  contents: write

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios/native
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test the Swift core
        working-directory: ios/native/DopaDamCore
        env:
          DOPADAM_VECTORS: ${{ github.workspace }}/shared/test-vectors
        run: |
          set -o pipefail
          mkdir -p ../build
          swift test 2>&1 | tee ../build/core-test.log

      - name: Generate the Xcode project
        run: |
          set -o pipefail
          mkdir -p build
          xcodegen generate 2>&1 | tee build/xcodegen.log

      - name: Build the app (Release, iphoneos, no signing)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project DopaDam.xcodeproj \
            -scheme DopaDam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package the unsigned .ipa
        run: |
          set -e
          APP="build/DerivedData/Build/Products/Release-iphoneos/DopaDam.app"
          test -d "$APP"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/DopaDam.app
          (cd build/ipa && zip -qry ../DopaDam-unsigned.ipa Payload)
          ls -l build/DopaDam-unsigned.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DopaDam-unsigned-ipa
          path: ios/native/build/DopaDam-unsigned.ipa
          if-no-files-found: error

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/native/build/xcodebuild.log
          if-no-files-found: warn

      # Puts the logs and the error lines on the ci-logs branch (one commit, replaced on every run), so they can
      # be read with a plain `git fetch`, without signing in to GitHub.
      - name: Publish the logs on the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          out="$RUNNER_TEMP/ci-logs"
          rm -rf "$out" && mkdir -p "$out"
          cp build/*.log "$out"/ 2>/dev/null
          grep -hE "(error|warning): " build/*.log | sort -u > "$out/errors.txt"
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "status: $JOB_STATUS"
            echo "ipa: $(ls build/DopaDam-unsigned.ipa 2>/dev/null || echo none)"
            xcodebuild -version | head -1
          } > "$out/summary.txt"
          cd "$out"
          git init -q
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "iOS build logs for $GITHUB_SHA"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs
