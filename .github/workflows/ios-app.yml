# Native DopaDam iPhone app on macOS runners, two jobs in parallel:
#   build            core tests, Release build for iphoneos, an UNSIGNED .ipa (sign it yourself: AltStore, Sideloadly, ...)
#   simulator-tests  runs the app on an iOS Simulator: App Intent unit tests and UI tests with a screenshot per step
# Runs on every push to linux-port that touches ios/native, and by hand (Actions -> "Ung dung DopaDam cho iPhone").
# Logs and screenshots go to the ci-logs-ios branch, one subfolder per job (ios/native/ci/publish-logs.sh).
# See ios/native/README.md.
name: Ung dung DopaDam cho iPhone

on:
  workflow_dispatch:
  # Called by release.yml, which publishes the .ipa.
  workflow_call:
  push:
    branches: [linux-port]
    paths:
      - "ios/native/**"
      - "shared/test-vectors/**"
      - ".github/workflows/ios-app.yml"

# contents: write only for the last step of each job, which publishes the logs on the ci-logs-ios branch.
permissions:
  contents: write

# One run per commit, never cancelled by a later push (the runs are long and the logs are what we read).
concurrency:
  group: ios-app-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios/native
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test the Swift core
        working-directory: ios/native/DopaDamCore
        env:
          DOPADAM_VECTORS: ${{ github.workspace }}/shared/test-vectors
        run: |
          set -o pipefail
          mkdir -p ../build
          swift test 2>&1 | tee ../build/core-test.log

      - name: Generate the Xcode project
        run: |
          set -o pipefail
          mkdir -p build
          xcodegen generate 2>&1 | tee build/xcodegen.log

      - name: Build the app (Release, iphoneos, no signing)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project DopaDam.xcodeproj \
            -scheme DopaDam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package the unsigned .ipa
        run: |
          set -e
          APP="build/DerivedData/Build/Products/Release-iphoneos/DopaDam.app"
          test -d "$APP"
          # The DEBUG launch hooks (Support/DebugLaunch.swift) must not be in the Release app.
          if strings -a "$APP/DopaDam" | grep -E "dopadam-(reset|warn|seed)|DebugLaunch"; then
            echo "error: the Release app contains the DEBUG launch hooks"; exit 1
          fi
          echo "Release app has no DEBUG launch hooks"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/DopaDam.app
          (cd build/ipa && zip -qry ../DopaDam-unsigned.ipa Payload)
          ls -l build/DopaDam-unsigned.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DopaDam-unsigned-ipa
          path: ios/native/build/DopaDam-unsigned.ipa
          if-no-files-found: error

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/native/build/xcodebuild.log
          if-no-files-found: warn

      # Puts the logs and the error lines on the ci-logs-ios branch (subfolder build/), so they can be read with a
      # plain `git fetch`, without signing in to GitHub.
      - name: Publish the logs on the ci-logs-ios branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          out="$RUNNER_TEMP/logs-build"
          rm -rf "$out" && mkdir -p "$out"
          cp build/*.log "$out"/ 2>/dev/null
          grep -hE "(error|warning): " build/*.log | sort -u > "$out/errors.txt"
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "status: $JOB_STATUS"
            echo "ipa: $(ls build/DopaDam-unsigned.ipa 2>/dev/null || echo none)"
            xcodebuild -version | head -1
          } > "$out/summary.txt"
          bash ci/publish-logs.sh build "$out"

  simulator-tests:
    name: simulator-tests (${{ matrix.kind }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The newest iPhone: every test.
          - kind: main
            only: ""
          # The narrowest iPhone (an SE, when the image has one): the layout-heavy tests, to see clipping.
          - kind: small
            only: "-only-testing:DopaDamUITests/TabsTests -only-testing:DopaDamUITests/StatsTests"
    defaults:
      run:
        working-directory: ios/native
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: |
          set -o pipefail
          mkdir -p build
          xcodegen generate 2>&1 | tee build/xcodegen.log
          echo "--- Info.plist keys generated by XcodeGen"
          cat Generated/DopaDam-Info.plist || true

      - name: Pick and boot a simulator
        id: sim
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -version | tee build/toolchain.log
          xcrun simctl list runtimes | tee -a build/toolchain.log
          # The soft keyboard (not the Mac's) must be what typeText talks to.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO || true
          picked="$(python3 ci/pick-simulator.py ${{ matrix.kind }} 2> build/simulators.log)" || picked=""
          cat build/simulators.log
          if [ -z "$picked" ]; then
            echo "no simulator for kind ${{ matrix.kind }}"
            echo "udid=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          udid="$(echo "$picked" | cut -f1)"
          echo "device: $(echo "$picked" | cut -f2) / $(echo "$picked" | cut -f3)" | tee -a build/simulators.log
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "device=$(echo "$picked" | cut -f2)" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Run the unit tests and the UI tests
        if: steps.sim.outputs.udid != ''
        run: |
          set -o pipefail
          rm -rf build/Test.xcresult
          xcodebuild test \
            -project DopaDam.xcodeproj \
            -scheme DopaDam \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedDataTest \
            -resultBundlePath build/Test.xcresult \
            -parallel-testing-enabled NO \
            -disable-concurrent-destination-testing \
            CODE_SIGNING_ALLOWED=NO \
            ${{ matrix.only }} \
            2>&1 | tee build/xcodebuild-test.log

      - name: Export the screenshots and the result summary
        if: always() && steps.sim.outputs.udid != ''
        run: |
          set +e
          python3 ci/collect-results.py build/Test.xcresult build/results "${{ matrix.kind }} / ${{ steps.sim.outputs.device }}"
          exit 0

      - name: Upload the screenshots
        if: always() && steps.sim.outputs.udid != ''
        uses: actions/upload-artifact@v4
        with:
          name: simulator-results-${{ matrix.kind }}
          path: ios/native/build/results
          if-no-files-found: warn

      - name: Publish the logs and screenshots on the ci-logs-ios branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          out="$RUNNER_TEMP/logs-sim"
          rm -rf "$out" && mkdir -p "$out"
          cp build/*.log "$out"/ 2>/dev/null
          cp -R build/results/. "$out"/ 2>/dev/null
          grep -hE "(error|warning): " build/xcodebuild-test.log 2>/dev/null | sort -u > "$out/errors.txt"
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "job status: $JOB_STATUS"
            echo "device: ${{ steps.sim.outputs.device }}"
            echo "---"
            cat build/results/summary.txt 2>/dev/null
          } > "$out/run-summary.txt"
          bash ci/publish-logs.sh "simulator-${{ matrix.kind }}" "$out"
