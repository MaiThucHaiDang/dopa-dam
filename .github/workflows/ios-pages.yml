# Builds the DopaDam page for iPhone (ios/) and publishes it on GitHub Pages.
# Runs only when started by hand (Actions → "Trang DopaDam cho iPhone" → Run workflow).
# Needs: Settings → Pages → Source: GitHub Actions. See ios/HUONG-DAN.md.
name: Trang DopaDam cho iPhone

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      # The page reuses the extension's core and its build tools.
      - run: npm ci
        working-directory: extension
      - run: node ios/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ios/dist
      - id: deployment
        uses: actions/deploy-pages@v4
